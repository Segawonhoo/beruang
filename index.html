<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERUANG EXCHANGE</title>
    
    <!-- Favicon Logo Beruang -->
    <link rel="icon" type="image/png" href="logo.png?v=5">

    <!-- ========================================================= -->
    <!-- ⚙️ PENGATURAN KURS OTOMATIS & MARGIN (EDIT DI SINI) -->
    <!-- ========================================================= -->
    <script>
        const RATE_MARGIN = 4;                // Margin tambahan dari kurs pasar (misal: +4)
        const TELEGRAM_USERNAME = "xecutivee";   // Username Telegram (tanpa tanda @)
    </script>
    <!-- ========================================================= -->

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .gold-bg-gradient {
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%);
        }
        .card-blur {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
        }
        .logo-container {
            width: 100%;
            max-width: 320px;
            height: 150px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.6);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Background Decoration Glows -->
    <div class="fixed -top-24 -left-24 w-96 h-96 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-24 -right-24 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="max-w-md w-full mx-auto my-auto relative z-10">
        <!-- Logo & Header Section -->
        <div class="text-center mb-5">
            <div class="logo-container mb-3 relative">
                <img id="logo-img" src="logo.png?v=5" class="drop-shadow-[0_12px_20px_rgba(234,179,8,0.35)] transition-transform hover:scale-105 duration-300" alt="Beruang Logo">
            </div>
            
            <!-- Live Date & Time PH Badge -->
            <div class="inline-flex items-center gap-2 bg-slate-800/90 border border-amber-500/30 px-3.5 py-1.5 rounded-full text-xs sm:text-sm text-amber-300 shadow-inner mb-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="live-date-time" class="font-medium tracking-wide">Mengambil Waktu...</span>
            </div>
            <p class="text-xs text-slate-400">Update Kurs & Real-time PH (Manila)</p>
        </div>

        <!-- Calculator Card -->
        <div class="card-blur border border-amber-500/20 rounded-3xl p-5 sm:p-7 shadow-2xl relative">
            
            <!-- Kurs Beli Info Box (Read Only) -->
            <div class="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 mb-5 flex items-center justify-between shadow-inner">
                <div>
                    <span id="rate-title" class="text-xs font-semibold text-slate-400 tracking-wider uppercase block">Harga Kurs Beli Hari Ini</span>
                    <span id="rate-unit" class="text-xs text-slate-500">1 PHP (Peso)</span>
                </div>
                <div class="text-right">
                    <span id="rate-display" class="text-2xl font-extrabold text-amber-400 tracking-tight">Memuat...</span>
                </div>
            </div>

            <form id="calc-form" class="space-y-4" onsubmit="return false;">
                <!-- Input Atas (Dinamis: PHP atau IDR) -->
                <div>
                    <label id="label-top" class="block text-xs font-medium text-slate-300 mb-1.5 ml-1">Jumlah Peso yang Dibeli (PHP)</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span id="symbol-top" class="text-amber-400 font-bold text-lg">₱</span>
                        </div>
                        <input type="text" id="input-top" placeholder="0" autocomplete="off"
                            class="w-full pl-10 pr-4 py-3.5 bg-slate-800/90 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-amber-400 text-lg font-semibold text-white placeholder-slate-500 transition-all outline-none">
                    </div>
                </div>

                <!-- Tombol Swap / Terbalik (Bisa Diklik) -->
                <div class="flex justify-center -my-2 relative z-10">
                    <button type="button" id="swap-btn" class="bg-slate-800 border border-slate-700 text-amber-400 rounded-full p-2.5 shadow-md hover:bg-slate-700 active:scale-95 transition-all cursor-pointer focus:outline-none" title="Balik Posisi Perhitungan">
                        <svg xmlns="http://www.w3.org/2000/svg" id="swap-icon" class="h-4 w-4 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                        </svg>
                    </button>
                </div>

                <!-- Input Bawah (Dinamis: IDR atau PHP) -->
                <div>
                    <label id="label-bottom" class="block text-xs font-medium text-slate-300 mb-1.5 ml-1">Total Pembayaran (IDR)</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span id="symbol-bottom" class="text-emerald-400 font-bold text-sm">Rp</span>
                        </div>
                        <input type="text" id="input-bottom" placeholder="0" autocomplete="off"
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-800/90 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-amber-400 text-lg font-semibold text-white placeholder-slate-500 transition-all outline-none">
                    </div>
                </div>

                <!-- Order Breakdown Summary -->
                <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 space-y-2 mt-4">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Rincian Order:</span>
                        <span id="summary-php" class="text-slate-200 font-medium">₱0</span>
                    </div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Rate Aplikasi:</span>
                        <span id="summary-rate" class="text-slate-200 font-medium">Rp 0 / PHP</span>
                    </div>
                    <hr class="border-slate-800 my-1">
                    <div class="flex justify-between text-sm font-bold">
                        <span class="text-slate-300">Total Bayar:</span>
                        <span id="summary-total" class="text-amber-400">Rp 0</span>
                    </div>
                </div>

                <!-- Telegram Order Button -->
                <button type="button" id="tele-btn" 
                    class="w-full gold-bg-gradient text-slate-950 font-bold py-4 px-6 rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.568 8.162l-2.01 9.471c-.15.672-.548.834-1.112.518l-3.074-2.267-1.483 1.427c-.164.164-.303.303-.621.303l.221-3.136 5.711-5.158c.248-.22-.054-.342-.386-.121l-7.058 4.444-3.037-.95c-.66-.206-.673-.66.138-.977l11.87-4.575c.55-.2.1.031.842.366z"/>
                    </svg>
                    Pesan via Telegram
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-xs text-slate-500">
            © BERUANG EXCHANGE
        </div>
    </main>

    <!-- Application Script Logic -->
    <script>
        let CURRENT_RATE = 285; // Fallback default
        let isPhpToIdr = true;   // Status arah mode kalkulator

        let currentPhpValue = 0;
        let currentIdrValue = 0;

        const rateDisplay = document.getElementById('rate-display');
        const rateUnit = document.getElementById('rate-unit');
        const inputTop = document.getElementById('input-top');
        const inputBottom = document.getElementById('input-bottom');
        const labelTop = document.getElementById('label-top');
        const labelBottom = document.getElementById('label-bottom');
        const symbolTop = document.getElementById('symbol-top');
        const symbolBottom = document.getElementById('symbol-bottom');
        const swapBtn = document.getElementById('swap-btn');
        const swapIcon = document.getElementById('swap-icon');

        const summaryPhp = document.getElementById('summary-php');
        const summaryRate = document.getElementById('summary-rate');
        const summaryTotal = document.getElementById('summary-total');
        const teleBtn = document.getElementById('tele-btn');
        const liveDateTime = document.getElementById('live-date-time');

        async function fetchLiveRate() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/PHP');
                const data = await response.json();
                
                if (data && data.rates && data.rates.IDR) {
                    let marketRateFloat = data.rates.IDR; 
                    let marketRateInt = Math.floor(marketRateFloat); 
                    
                    CURRENT_RATE = marketRateInt + RATE_MARGIN; 

                    updateRateDisplay();
                    calculate();
                }
            } catch (error) {
                console.error("Gagal mengambil kurs otomatis:", error);
                updateRateDisplay();
            }
        }

        function updateRateDisplay() {
            if (isPhpToIdr) {
                rateDisplay.innerText = `Rp ${CURRENT_RATE.toLocaleString('id-ID')}`;
                rateUnit.innerText = "1 PHP (Peso)";
                summaryRate.innerText = `Rp ${CURRENT_RATE.toLocaleString('id-ID')} / PHP`;
            } else {
                // Jika dibalik, hitung nilai per 1 IDR dalam bentuk PHP desimal
                let ratePerIdr = (1 / CURRENT_RATE).toFixed(4);
                rateDisplay.innerText = `${ratePerIdr} PHP`;
                rateUnit.innerText = "1 IDR (Rupiah)";
                summaryRate.innerText = `1 IDR = ${ratePerIdr} PHP`;
            }
        }

        fetchLiveRate();

        // Menggunakan Zona Waktu Filipina (Asia/Manila)
        function updateLiveDateTime() {
            const now = new Date();
            const optionsDate = { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Manila' };
            const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Manila' };

            const dateStr = now.toLocaleDateString('id-ID', optionsDate);
            const timeStr = now.toLocaleTimeString('id-ID', optionsTime);

            liveDateTime.innerText = `${dateStr} • ${timeStr} PH`;
        }

        updateLiveDateTime();
        setInterval(updateLiveDateTime, 1000);

        function formatRupiah(angka) {
            if (isNaN(angka)) return "";
            return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function calculate() {
            if (isPhpToIdr) {
                let rawValue = inputTop.value.replace(/\./g, '').replace(',', '.');
                const phpVal = parseFloat(rawValue) || 0;
                
                if (phpVal > 0) {
                    inputTop.value = formatRupiah(Math.floor(phpVal));
                    const totalIdr = Math.round(phpVal * CURRENT_RATE);
                    inputBottom.value = totalIdr > 0 ? formatRupiah(totalIdr) : '';
                    
                    currentPhpValue = phpVal;
                    currentIdrValue = totalIdr;
                    renderSummary(phpVal, totalIdr);
                } else {
                    inputBottom.value = '';
                    currentPhpValue = 0;
                    currentIdrValue = 0;
                    renderSummary(0, 0);
                }
            } else {
                let rawValue = inputTop.value.replace(/\./g, '');
                const idrVal = parseFloat(rawValue) || 0;
                
                if (idrVal > 0) {
                    inputTop.value = formatRupiah(idrVal);
                    const totalPhp = (idrVal / CURRENT_RATE);
                    
                    inputBottom.value = formatRupiah(Math.floor(totalPhp));
                    
                    currentPhpValue = totalPhp;
                    currentIdrValue = idrVal;
                    renderSummary(totalPhp, idrVal);
                } else {
                    inputBottom.value = '';
                    currentPhpValue = 0;
                    currentIdrValue = 0;
                    renderSummary(0, 0);
                }
            }
        }

        // Event listener saat tombol panah ditukar
        swapBtn.addEventListener('click', () => {
            isPhpToIdr = !isPhpToIdr;
            
            // Efek putar ikon panah
            swapIcon.style.transform = isPhpToIdr ? 'rotate(0deg)' : 'rotate(180deg)';

            // Tukar label dan simbol mata uang atas & bawah
            if (isPhpToIdr) {
                labelTop.innerText = "Jumlah Peso yang Dibeli (PHP)";
                symbolTop.innerText = "₱";
                symbolTop.className = "text-amber-400 font-bold text-lg";
                inputTop.classList.remove("pl-12");
                inputTop.classList.add("pl-10");

                labelBottom.innerText = "Total Pembayaran (IDR)";
                symbolBottom.innerText = "Rp";
                symbolBottom.className = "text-emerald-400 font-bold text-sm";
                inputBottom.classList.remove("pl-10");
                inputBottom.classList.add("pl-12");
            } else {
                labelTop.innerText = "Jumlah Rupiah yang Dibayar (IDR)";
                symbolTop.innerText = "Rp";
                symbolTop.className = "text-emerald-400 font-bold text-sm";
                inputTop.classList.remove("pl-10");
                inputTop.classList.add("pl-12");

                labelBottom.innerText = "Total Peso yang Didapat (PHP)";
                symbolBottom.innerText = "₱";
                symbolBottom.className = "text-amber-400 font-bold text-lg";
                inputBottom.classList.remove("pl-12");
                inputBottom.classList.add("pl-10");
            }

            // Reset nilai input saat ditukar
            inputTop.value = '';
            inputBottom.value = '';
            currentPhpValue = 0;
            currentIdrValue = 0;
            renderSummary(0, 0);
            updateRateDisplay();
        });

        inputTop.addEventListener('input', calculate);

        function renderSummary(php, idr) {
            summaryPhp.innerText = `₱${Math.round(php).toLocaleString('id-ID')}`;
            summaryTotal.innerText = `Rp ${idr.toLocaleString('id-ID')}`;
        }

        teleBtn.addEventListener('click', () => {
            if (currentPhpValue <= 0 || currentIdrValue <= 0) {
                alert("Silakan masukkan nominal terlebih dahulu!");
                return;
            }

            const cleanUsername = TELEGRAM_USERNAME.replace('@', '');
            
            const formattedPhp = Math.round(currentPhpValue).toLocaleString('id-ID');
            const formattedIdr = currentIdrValue.toLocaleString('id-ID');
            
            const message = `Order: ${formattedPhp}\nTotal: Rp.${formattedIdr}`;
            
            window.open(`https://t.me/${cleanUsername}?text=${encodeURIComponent(message)}`, '_blank');
        });
    </script>
</body>
</html>
