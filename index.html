<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BERUANG - Jual Beli Peso</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FDE047 0%, #EAB308 50%, #CA8A04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-bg-gradient {
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%);
        }
        .card-blur {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 relative overflow-x-hidden">

    <!-- Background Decoration Glows -->
    <div class="fixed -top-24 -left-24 w-96 h-96 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-24 -right-24 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="max-w-md w-full mx-auto my-auto relative z-10">
        <!-- Logo & Header Section -->
        <div class="text-center mb-6">
            <div class="inline-block relative mb-3">
                <img id="logo-img" class="w-36 h-36 sm:w-44 sm:h-44 object-contain mx-auto drop-shadow-[0_10px_15px_rgba(234,179,8,0.3)] transition-transform hover:scale-105 duration-300" alt="Beruang Logo">
            </div>
            
            <!-- Live Date & Time WIB Badge -->
            <div class="inline-flex items-center gap-2 bg-slate-800/90 border border-amber-500/30 px-3.5 py-1.5 rounded-full text-xs sm:text-sm text-amber-300 shadow-inner mb-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="live-date-time" class="font-medium tracking-wide">Mengambil Waktu...</span>
            </div>
            <p class="text-xs text-slate-400">Update Kurs Real-time WIB</p>
        </div>

        <!-- Calculator Card -->
        <div class="card-blur border border-amber-500/20 rounded-3xl p-5 sm:p-7 shadow-2xl relative">
            
            <!-- Kurs Beli Info Box (Read Only) -->
            <div class="bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 mb-5 flex items-center justify-between shadow-inner">
                <div>
                    <span class="text-xs font-semibold text-slate-400 tracking-wider uppercase block">Harga Kurs Beli Hari Ini</span>
                    <span class="text-xs text-slate-500">1 PHP (Peso)</span>
                </div>
                <div class="text-right">
                    <span id="rate-display" class="text-2xl font-extrabold text-amber-400 tracking-tight">Rp 285</span>
                </div>
            </div>

            <form id="calc-form" class="space-y-4" onsubmit="return false;">
                <!-- Input PHP (Peso) -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5 ml-1">Jumlah Peso yang Dibeli (PHP)</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-amber-400 font-bold text-lg">₱</span>
                        </div>
                        <input type="number" id="php-input" placeholder="0" min="0" step="any"
                            class="w-full pl-10 pr-4 py-3.5 bg-slate-800/90 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-amber-400 text-lg font-semibold text-white placeholder-slate-500 transition-all outline-none">
                    </div>
                </div>

                <!-- Divider Icon -->
                <div class="flex justify-center -my-2 relative z-10">
                    <div class="bg-slate-800 border border-slate-700 text-amber-400 rounded-full p-2 shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                        </svg>
                    </div>
                </div>

                <!-- Input IDR (Rupiah) -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5 ml-1">Total Pembayaran (IDR)</label>
                    <div class="relative rounded-2xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-emerald-400 font-bold text-sm">Rp</span>
                        </div>
                        <input type="number" id="idr-input" placeholder="0" min="0" step="any"
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-800/90 border border-slate-700 rounded-2xl focus:ring-2 focus:ring-amber-400 focus:border-amber-400 text-lg font-semibold text-white placeholder-slate-500 transition-all outline-none">
                    </div>
                </div>

                <!-- Order Breakdown Summary -->
                <div class="bg-slate-900/60 rounded-2xl p-4 border border-slate-800 space-y-2 mt-4">
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Rincian Order:</span>
                        <span id="summary-php" class="text-slate-200 font-medium">₱0</span>
                    </div>
                    <div class="flex justify-between text-xs text-slate-400">
                        <span>Rate Aplikasi:</span>
                        <span id="summary-rate" class="text-slate-200 font-medium">Rp 0 / PHP</span>
                    </div>
                    <hr class="border-slate-800 my-1">
                    <div class="flex justify-between text-sm font-bold">
                        <span class="text-slate-300">Total Bayar:</span>
                        <span id="summary-total" class="text-amber-400">Rp 0</span>
                    </div>
                </div>

                <!-- WhatsApp Order Button -->
                <button type="button" id="wa-btn" 
                    class="w-full gold-bg-gradient text-slate-950 font-bold py-4 px-6 rounded-2xl shadow-lg hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                    </svg>
                    Pesan via WhatsApp
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-xs text-slate-500">
            © BERUANG - Jual Beli Peso Филиппины
        </div>
    </main>

    <script>
        // ==========================================
        // CONFIGURASI ADMIN & KURS (Ubah Di Sini)
        // ==========================================
        const DEFAULT_RATE = 285;            // Ubah harga Kurs Beli per 1 PHP
        const ADMIN_WA_NUMBER = "6281234567890"; // Nomor WA Admin (gunakan kode negara 62)

        // Logo Image URL (Gambar Logo Beruang)
        const LOGO_SRC = "https://lh3.googleusercontent.com/gg/AElqA72yAnkE7f8h4UeJ4oOxlQv9Hj5j_9mN6LdE8I9M=s1024";

        // Dynamic Elements
        const rateDisplay = document.getElementById('rate-display');
        const phpInput = document.getElementById('php-input');
        const idrInput = document.getElementById('idr-input');
        const summaryPhp = document.getElementById('summary-php');
        const summaryRate = document.getElementById('summary-rate');
        const summaryTotal = document.getElementById('summary-total');
        const waBtn = document.getElementById('wa-btn');
        const liveDateTime = document.getElementById('live-date-time');
        const logoImg = document.getElementById('logo-img');

        // Set Logo
        logoImg.src = LOGO_SRC;

        // Set Default Rate Display
        rateDisplay.innerText = `Rp ${DEFAULT_RATE.toLocaleString('id-ID')}`;
        summaryRate.innerText = `Rp ${DEFAULT_RATE.toLocaleString('id-ID')} / PHP`;

        // Live Real-Time Date & Time (Asia/Jakarta - WIB)
        function updateLiveDateTime() {
            const now = new Date();
            const optionsDate = { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric',
                timeZone: 'Asia/Jakarta'
            };
            const optionsTime = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                timeZone: 'Asia/Jakarta'
            };

            const dateStr = now.toLocaleDateString('id-ID', optionsDate);
            const timeStr = now.toLocaleTimeString('id-ID', optionsTime);

            liveDateTime.innerText = `${dateStr} • ${timeStr} WIB`;
        }

        updateLiveDateTime();
        setInterval(updateLiveDateTime, 1000);

        // Calculation Logic
        function updateFromPHP() {
            const phpVal = parseFloat(phpInput.value) || 0;
            const totalIdr = Math.round(phpVal * DEFAULT_RATE);

            idrInput.value = totalIdr > 0 ? totalIdr : '';
            renderSummary(phpVal, totalIdr);
        }

        function updateFromIDR() {
            const idrVal = parseFloat(idrInput.value) || 0;
            const totalPhp = idrVal > 0 ? (idrVal / DEFAULT_RATE).toFixed(2) : 0;

            phpInput.value = totalPhp > 0 ? totalPhp : '';
            renderSummary(parseFloat(totalPhp), idrVal);
        }

        function renderSummary(php, idr) {
            summaryPhp.innerText = `₱${php.toLocaleString('en-US')}`;
            summaryTotal.innerText = `Rp ${idr.toLocaleString('id-ID')}`;
        }

        phpInput.addEventListener('input', updateFromPHP);
        idrInput.addEventListener('input', updateFromIDR);

        // WhatsApp Direct Integration
        waBtn.addEventListener('click', () => {
            const phpVal = parseFloat(phpInput.value) || 0;
            const idrVal = parseFloat(idrInput.value) || 0;

            if (phpVal <= 0) {
                alert('Silakan masukkan jumlah Peso yang ingin dibeli.');
                phpInput.focus();
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' });

            const text = `Halo Admin BERUANG, saya mau beli Peso (PHP):\n\n` +
                         `Tanggal: ${dateStr} (${timeStr} WIB)\n` +
                         `Jumlah Beli: ₱${phpVal.toLocaleString('en-US')}\n` +
                         `Rate: Rp ${DEFAULT_RATE.toLocaleString('id-ID')}\n` +
                         `Total Bayar: Rp ${idrVal.toLocaleString('id-ID')}\n\n` +
                         `Mohon diproses, terima kasih!`;

            const encodedText = encodeURIComponent(text);
            window.open(`https://wa.me/${ADMIN_WA_NUMBER}?text=${encodedText}`, '_blank');
        });
    </script>
</body>
</html>
